<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Создание персональной валентинки</title>
  <desc id="description">Экран создания валентинки: ввод имени, выбор языка и кнопка создания ссылки.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c24268" opacity="0.14" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#6b2d43" flood-opacity="0.10" />
    </filter>
  </defs>
  <rect width="1280" height="800" fill="#fff8f6" />
  <rect width="1280" height="800" fill="url(#dots)" />
  <g font-family="Quicksand, Arial, sans-serif">
    <rect x="1084" y="28" width="164" height="54" rx="27" fill="#fff7fa" stroke="#f1d2df" />
    <rect x="1092" y="36" width="50" height="38" rx="19" fill="#ff54a4" />
    <text x="1107" y="61" font-size="15" font-weight="700" fill="#fff">RU</text>
    <text x="1159" y="62" font-size="16" font-weight="600" fill="#74445a">KG</text>
    <text x="1205" y="62" font-size="16" font-weight="600" fill="#74445a">EN</text>

    <rect x="112" y="132" width="1056" height="536" rx="8" fill="#fffafd" stroke="#e9cbd5" filter="url(#shadow)" />
    <path d="M113 140 Q113 133 121 133 H655 V667 H121 Q113 667 113 659 Z" fill="#fff" opacity="0.74" />

    <text x="190" y="248" font-size="15" font-weight="700" letter-spacing="1.2" fill="#9e375a">LOVE NOTE</text>
    <text x="306" y="248" font-size="14" font-weight="600" fill="#a88b96">NO. 01</text>
    <text x="190" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#542b3e">Создай</text>
    <text x="190" y="412" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#542b3e">валентинку</text>
    <text x="190" y="463" font-size="18" fill="#805d6d">Один вопрос. Одно имя.</text>
    <text x="190" y="492" font-size="18" fill="#805d6d">И немного смелости.</text>

    <circle cx="263" cy="574" r="54" fill="#ffe5ec" stroke="#e9b7c8" />
    <circle cx="273" cy="580" r="54" fill="none" stroke="#f7cbd8" stroke-width="8" />
    <path d="M263 603 C251 592 235 580 235 565 C235 547 257 542 263 559 C270 542 291 547 291 565 C291 580 276 593 263 603Z" fill="#e4507b" />

    <rect x="692" y="258" width="390" height="300" rx="8" fill="#fff" stroke="#f0d8df" filter="url(#shadow)" />
    <text x="724" y="308" font-size="17" font-weight="700" fill="#61374a">Имя любимого человека</text>
    <rect x="724" y="330" width="326" height="54" rx="10" fill="#fff" stroke="#e6c5d4" />
    <text x="744" y="364" font-size="17" fill="#a78a98">Например, Алина</text>
    <rect x="724" y="405" width="326" height="54" rx="6" fill="#c83e68" />
    <text x="746" y="439" font-size="16" font-weight="700" fill="#fff">Создать ссылку</text>
    <text x="1022" y="442" font-size="22" font-weight="700" fill="#fff">→</text>
    <circle cx="735" cy="497" r="10" fill="#f8e8ed" />
    <text x="731" y="501" font-size="11" font-weight="700" fill="#a73e60">✓</text>
    <text x="753" y="502" font-size="13" fill="#896c78">Только для одного особенного человека</text>
  </g>
</svg>
